<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Levi: Block Infrastructure / Processing Grid -->
  <defs>
    <style>
      .primary { stroke: #DFFF00; }
      .secondary { stroke: rgba(223, 255, 0, 0.35); }
      .tertiary { stroke: rgba(223, 255, 0, 0.12); }
    </style>
  </defs>
  
  <!-- Outer frame -->
  <rect x="12" y="12" width="96" height="96" rx="4" class="secondary" stroke-dasharray="6 4"/>
  
  <!-- Inner grid boundary -->
  <rect x="24" y="24" width="72" height="72" rx="2" class="tertiary"/>
  
  <!-- Central processing block -->
  <rect x="48" y="48" width="24" height="24" rx="2" class="primary" fill="rgba(223,255,0,0.08)"/>
  <rect x="54" y="54" width="12" height="12" rx="1" class="primary" fill="rgba(223,255,0,0.15)"/>
  <circle cx="60" cy="60" r="2.5" class="primary" fill="#DFFF00"/>
  
  <!-- Data pathways horizontal -->
  <line x1="24" y1="36" x2="48" y2="36" class="secondary"/>
  <line x1="72" y1="36" x2="96" y2="36" class="secondary"/>
  <line x1="24" y1="60" x2="48" y2="60" class="primary"/>
  <line x1="72" y1="60" x2="96" y2="60" class="primary"/>
  <line x1="24" y1="84" x2="48" y2="84" class="secondary"/>
  <line x1="72" y1="84" x2="96" y2="84" class="secondary"/>
  
  <!-- Data pathways vertical -->
  <line x1="36" y1="24" x2="36" y2="48" class="secondary"/>
  <line x1="60" y1="24" x2="60" y2="48" class="primary"/>
  <line x1="84" y1="24" x2="84" y2="48" class="secondary"/>
  <line x1="36" y1="72" x2="36" y2="96" class="secondary"/>
  <line x1="60" y1="72" x2="60" y2="96" class="primary"/>
  <line x1="84" y1="72" x2="84" y2="96" class="secondary"/>
  
  <!-- Corner block pins -->
  <rect x="15" y="15" width="8" height="8" rx="1" class="tertiary" fill="rgba(223,255,0,0.03)"/>
  <rect x="97" y="15" width="8" height="8" rx="1" class="tertiary" fill="rgba(223,255,0,0.03)"/>
  <rect x="15" y="97" width="8" height="8" rx="1" class="tertiary" fill="rgba(223,255,0,0.03)"/>
  <rect x="97" y="97" width="8" height="8" rx="1" class="tertiary" fill="rgba(223,255,0,0.03)"/>
  
  <!-- Pathway nodes -->
  <rect x="34" y="34" width="4" height="4" rx="1" class="secondary" fill="rgba(223,255,0,0.2)"/>
  <rect x="82" y="34" width="4" height="4" rx="1" class="secondary" fill="rgba(223,255,0,0.2)"/>
  <rect x="34" y="82" width="4" height="4" rx="1" class="secondary" fill="rgba(223,255,0,0.2)"/>
  <rect x="82" y="82" width="4" height="4" rx="1" class="secondary" fill="rgba(223,255,0,0.2)"/>
</svg>