<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background -->
  <rect width="800" height="500" fill="#0A0A0A"/>

  <!-- Subtle grid -->
  <g opacity="0.06">
    <line x1="0" y1="100" x2="800" y2="100" stroke="#DFFF00" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#DFFF00" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#DFFF00" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#DFFF00" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="#DFFF00" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke="#DFFF00" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="#DFFF00" stroke-width="0.5"/>
  </g>

  <!-- Outer frame -->
  <rect x="120" y="80" width="560" height="340" fill="none" stroke="#DFFF00" stroke-width="0.5" opacity="0.15"/>

  <!-- Corner brackets -->
  <path d="M 280 130 L 280 110 L 300 110" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.7"/>
  <path d="M 500 110 L 520 110 L 520 130" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.7"/>
  <path d="M 280 370 L 280 390 L 300 390" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.7"/>
  <path d="M 500 390 L 520 390 L 520 370" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.7"/>

  <!-- Central Agent Hub -->
  <!-- Agent head -->
  <circle cx="400" cy="200" r="35" fill="none" stroke="#DFFF00" stroke-width="2" opacity="0.9"/>
  <circle cx="400" cy="200" r="30" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.3"/>

  <!-- Agent eyes -->
  <circle cx="388" cy="195" r="5" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.8"/>
  <circle cx="412" cy="195" r="5" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.8"/>
  <circle cx="388" cy="195" r="2" fill="#DFFF00" opacity="0.5"/>
  <circle cx="412" cy="195" r="2" fill="#DFFF00" opacity="0.5"/>

  <!-- Agent mouth -->
  <line x1="390" y1="212" x2="410" y2="212" stroke="#DFFF00" stroke-width="1" opacity="0.6"/>

  <!-- Agent body -->
  <path d="M 375 240 L 425 240 L 435 290 L 365 290 Z" fill="none" stroke="#DFFF00" stroke-width="1.5" opacity="0.8"/>
  <line x1="400" y1="240" x2="400" y2="290" stroke="#DFFF00" stroke-width="0.8" opacity="0.4"/>

  <!-- Skill nodes around central agent -->
  <!-- Skill 1: Code -->
  <rect x="280" y="160" width="32" height="32" rx="3" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.85"/>
  <line x1="288" y1="168" x2="304" y2="168" stroke="#DFFF00" stroke-width="0.8" opacity="0.5"/>
  <line x1="288" y1="176" x2="300" y2="176" stroke="#DFFF00" stroke-width="0.8" opacity="0.5"/>
  <line x1="288" y1="184" x2="296" y2="184" stroke="#DFFF00" stroke-width="0.8" opacity="0.5"/>

  <!-- Skill 2: Workflow -->
  <rect x="280" y="220" width="32" height="32" rx="3" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.85"/>
  <polyline points="288,228 296,236 304,228 312,236" fill="none" stroke="#DFFF00" stroke-width="1" opacity="0.6"/>

  <!-- Skill 3: Database -->
  <rect x="280" y="280" width="32" height="32" rx="3" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.85"/>
  <ellipse cx="296" cy="288" rx="8" ry="4" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.6"/>
  <line x1="288" y1="292" x2="288" y2="304" stroke="#DFFF00" stroke-width="0.8" opacity="0.6"/>
  <line x1="304" y1="292" x2="304" y2="304" stroke="#DFFF00" stroke-width="0.8" opacity="0.6"/>
  <path d="M 288 304 Q 296 308 304 304" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.6"/>

  <!-- Skill 4: API -->
  <rect x="488" y="160" width="32" height="32" rx="3" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.85"/>
  <line x1="496" y1="168" x2="512" y2="168" stroke="#DFFF00" stroke-width="0.8" opacity="0.5"/>
  <line x1="496" y1="176" x2="512" y2="176" stroke="#DFFF00" stroke-width="0.8" opacity="0.5"/>
  <line x1="496" y1="184" x2="504" y2="184" stroke="#DFFF00" stroke-width="0.8" opacity="0.5"/>

  <!-- Skill 5: Security -->
  <rect x="488" y="220" width="32" height="32" rx="3" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.85"/>
  <path d="M 496 228 L 504 228 L 504 236 L 496 236 Z" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.6"/>
  <line x1="500" y1="236" x2="500" y2="244" stroke="#DFFF00" stroke-width="0.8" opacity="0.6"/>
  <circle cx="500" cy="244" r="3" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.6"/>

  <!-- Skill 6: Docker -->
  <rect x="488" y="280" width="32" height="32" rx="3" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.85"/>
  <rect x="492" y="288" width="8" height="8" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.6"/>
  <rect x="502" y="288" width="8" height="8" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.6"/>
  <rect x="492" y="298" width="8" height="8" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.6"/>
  <rect x="502" y="298" width="8" height="8" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.6"/>

  <!-- Connection lines: skills to agent -->
  <line x1="312" y1="176" x2="365" y2="195" stroke="#DFFF00" stroke-width="0.8" opacity="0.4"/>
  <line x1="312" y1="236" x2="365" y2="210" stroke="#DFFF00" stroke-width="0.8" opacity="0.4"/>
  <line x1="312" y1="296" x2="375" y2="255" stroke="#DFFF00" stroke-width="0.8" opacity="0.4"/>
  <line x1="488" y1="176" x2="435" y2="195" stroke="#DFFF00" stroke-width="0.8" opacity="0.4"/>
  <line x1="488" y1="236" x2="435" y2="210" stroke="#DFFF00" stroke-width="0.8" opacity="0.4"/>
  <line x1="488" y1="296" x2="425" y2="255" stroke="#DFFF00" stroke-width="0.8" opacity="0.4"/>

  <!-- Multi-agent orchestration: smaller agents -->
  <!-- Agent 2 (top-left) -->
  <circle cx="220" cy="140" r="18" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.7"/>
  <circle cx="215" cy="136" r="2.5" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.6"/>
  <circle cx="225" cy="136" r="2.5" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.6"/>
  <line x1="216" y1="146" x2="224" y2="146" stroke="#DFFF00" stroke-width="0.6" opacity="0.5"/>
  <!-- Connection to hub -->
  <line x1="238" y1="148" x2="280" y2="176" stroke="#DFFF00" stroke-width="0.6" opacity="0.3"/>

  <!-- Agent 3 (top-right) -->
  <circle cx="580" cy="140" r="18" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.7"/>
  <circle cx="575" cy="136" r="2.5" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.6"/>
  <circle cx="585" cy="136" r="2.5" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.6"/>
  <line x1="576" y1="146" x2="584" y2="146" stroke="#DFFF00" stroke-width="0.6" opacity="0.5"/>
  <!-- Connection to hub -->
  <line x1="562" y1="148" x2="520" y2="176" stroke="#DFFF00" stroke-width="0.6" opacity="0.3"/>

  <!-- Agent 4 (bottom-left) -->
  <circle cx="220" cy="340" r="18" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.7"/>
  <circle cx="215" cy="336" r="2.5" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.6"/>
  <circle cx="225" cy="336" r="2.5" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.6"/>
  <line x1="216" y1="346" x2="224" y2="346" stroke="#DFFF00" stroke-width="0.6" opacity="0.5"/>
  <!-- Connection to hub -->
  <line x1="238" y1="332" x2="280" y2="296" stroke="#DFFF00" stroke-width="0.6" opacity="0.3"/>

  <!-- Agent 5 (bottom-right) -->
  <circle cx="580" cy="340" r="18" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.7"/>
  <circle cx="575" cy="336" r="2.5" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.6"/>
  <circle cx="585" cy="336" r="2.5" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.6"/>
  <line x1="576" y1="346" x2="584" y2="346" stroke="#DFFF00" stroke-width="0.6" opacity="0.5"/>
  <!-- Connection to hub -->
  <line x1="562" y1="332" x2="520" y2="296" stroke="#DFFF00" stroke-width="0.6" opacity="0.3"/>

  <!-- Safety guards / Shield frame around central agent -->
  <path d="M 340 150 L 340 320 L 400 350 L 460 320 L 460 150" fill="none" stroke="#DFFF00" stroke-width="1" opacity="0.3"/>
  <path d="M 345 155 L 345 315 L 400 342 L 455 315 L 455 155" fill="none" stroke="#DFFF00" stroke-width="0.5" opacity="0.15"/>

  <!-- Workflow arrows -->
  <!-- Circular flow around agents -->
  <path d="M 240 140 Q 400 100 560 140" fill="none" stroke="#DFFF00" stroke-width="0.6" opacity="0.2" stroke-dasharray="4 2"/>
  <path d="M 560 340 Q 400 380 240 340" fill="none" stroke="#DFFF00" stroke-width="0.6" opacity="0.2" stroke-dasharray="4 2"/>

  <!-- Central workflow arrows -->
  <path d="M 400 130 L 400 115" fill="none" stroke="#DFFF00" stroke-width="1" opacity="0.5"/>
  <polygon points="400,110 396,118 404,118" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.5"/>

  <path d="M 400 370 L 400 385" fill="none" stroke="#DFFF00" stroke-width="1" opacity="0.5"/>
  <polygon points="400,390 396,382 404,382" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.5"/>

  <!-- Paperclip fork origin indicator -->
  <rect x="150" y="230" width="50" height="36" rx="2" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.4"/>
  <line x1="158" y1="238" x2="192" y2="238" stroke="#DFFF00" stroke-width="0.6" opacity="0.3"/>
  <line x1="158" y1="244" x2="188" y2="244" stroke="#DFFF00" stroke-width="0.6" opacity="0.3"/>
  <line x1="158" y1="250" x2="184" y2="250" stroke="#DFFF00" stroke-width="0.6" opacity="0.3"/>
  <line x1="158" y1="256" x2="190" y2="256" stroke="#DFFF00" stroke-width="0.6" opacity="0.3"/>
  <!-- Fork arrow -->
  <line x1="200" y1="248" x2="240" y2="248" stroke="#DFFF00" stroke-width="0.8" opacity="0.3"/>
  <polygon points="240,248 232,244 232,252" fill="#DFFF00" opacity="0.3"/>
  <text x="160" y="225" fill="none" stroke="#DFFF00" stroke-width="0.3" font-size="8" opacity="0.2">PAPERCLIP</text>

  <!-- Small decorative nodes -->
  <circle cx="200" cy="150" r="2" fill="#DFFF00" opacity="0.3"/>
  <circle cx="600" cy="350" r="2" fill="#DFFF00" opacity="0.3"/>
  <circle cx="220" cy="360" r="1.5" fill="#DFFF00" opacity="0.2"/>
  <circle cx="580" cy="160" r="1.5" fill="#DFFF00" opacity="0.2"/>

  <!-- Scan lines -->
  <line x1="150" y1="180" x2="220" y2="180" stroke="#DFFF00" stroke-width="0.5" opacity="0.2" stroke-dasharray="6 3"/>
  <line x1="150" y1="320" x2="220" y2="320" stroke="#DFFF00" stroke-width="0.5" opacity="0.2" stroke-dasharray="6 3"/>
  <line x1="580" y1="160" x2="650" y2="160" stroke="#DFFF00" stroke-width="0.5" opacity="0.2" stroke-dasharray="6 3"/>
  <line x1="580" y1="340" x2="650" y2="340" stroke="#DFFF00" stroke-width="0.5" opacity="0.2" stroke-dasharray="6 3"/>

  <!-- Horizontal scan line -->
  <line x1="0" y1="250" x2="800" y2="250" stroke="#DFFF00" stroke-width="0.3" opacity="0.08"/>
</svg>