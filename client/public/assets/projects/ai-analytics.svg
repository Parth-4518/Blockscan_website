<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      .bg { fill: #0a0a0a; }
      .grid-fine { stroke: rgba(255, 107, 53, 0.03); stroke-width: 0.3; }
      .grid-coarse { stroke: rgba(255, 107, 53, 0.06); stroke-width: 0.5; }
      .wire { fill: none; stroke: #FF6B35; stroke-width: 0.6; opacity: 0.25; }
      .wire-dim { fill: none; stroke: #FF6B35; stroke-width: 0.4; opacity: 0.1; }
      .wire-accent { fill: none; stroke: #FF6B35; stroke-width: 1; opacity: 0.4; }
      .cube { fill: none; stroke: #FF6B35; stroke-width: 0.6; opacity: 0.35; }
      .cube-fill { fill: rgba(255, 107, 53, 0.04); stroke: #FF6B35; stroke-width: 0.4; opacity: 0.25; }
      .node { fill: #FF6B35; opacity: 0.5; }
      .node-dim { fill: rgba(255, 107, 53, 0.2); }
      .text { font-family: 'IBM Plex Sans', monospace; font-size: 8px; fill: rgba(255, 107, 53, 0.15); letter-spacing: 0.25em; }
      .label { font-family: 'IBM Plex Sans', monospace; font-size: 7px; fill: rgba(255, 255, 255, 0.1); letter-spacing: 0.2em; }
      .stamp { font-family: 'IBM Plex Sans', monospace; font-size: 10px; fill: rgba(255, 107, 53, 0.12); letter-spacing: 0.4em; font-weight: 700; }
      .title-large { font-family: 'Bebas Neue', sans-serif; font-size: 72px; fill: rgba(255, 255, 255, 0.03); letter-spacing: 0.15em; }
    </style>
    
    <pattern id="grid1-analytics" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" class="grid-fine"/>
    </pattern>
    <pattern id="grid2-analytics" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 120 0 L 0 0 0 120" class="grid-coarse"/>
    </pattern>
    
    <radialGradient id="glow-analytics" cx="65%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#FF6B35" stop-opacity="0.01"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="vignette-analytics" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" class="bg"/>
  <rect width="800" height="500" fill="url(#grid1-analytics)"/>
  <rect width="800" height="500" fill="url(#grid2-analytics)"/>
  <rect width="800" height="500" fill="url(#glow-analytics)"/>

  <g opacity="0.08">
    <line x1="0" y1="80" x2="800" y2="80" class="wire-dim"/>
    <line x1="0" y1="200" x2="800" y2="200" class="wire-dim"/>
    <line x1="0" y1="320" x2="800" y2="320" class="wire-dim"/>
    <line x1="0" y1="440" x2="800" y2="440" class="wire-dim"/>
    <line x1="150" y1="0" x2="150" y2="500" class="wire-dim"/>
    <line x1="350" y1="0" x2="350" y2="500" class="wire-dim"/>
    <line x1="550" y1="0" x2="550" y2="500" class="wire-dim"/>
    <line x1="750" y1="0" x2="750" y2="500" class="wire-dim"/>
  </g>

  <text x="40" y="35" class="text">ECK ANALYTICS // PLATFORM</text>
  <text x="40" y="48" class="text">METRICS: 4.2M</text>
  <text x="620" y="35" class="text">LAT 51.5074 N</text>
  <text x="620" y="48" class="text">LON 0.1278 W</text>

  <text x="400" y="280" class="title-large" text-anchor="middle">ANALYTICS</text>

  <g transform="translate(540, 150)">
    <g transform="translate(0, 0)">
      <polygon points="0,-35 40,-55 80,-35 40,-15" class="cube-fill"/>
      <polygon points="0,-35 40,-55 80,-35 40,-15" class="cube"/>
      <polygon points="0,-35 40,-15 40,35 0,15" class="cube" opacity="0.5"/>
      <polygon points="40,-15 80,-35 80,15 40,35" class="cube" opacity="0.3"/>
    </g>
    
    <g transform="translate(-60, 25)">
      <polygon points="0,-25 30,-40 60,-25 30,-10" class="cube-fill"/>
      <polygon points="0,-25 30,-40 60,-25 30,-10" class="cube"/>
      <polygon points="0,-25 30,-10 30,30 0,15" class="cube" opacity="0.4"/>
      <polygon points="30,-10 60,-25 60,15 30,30" class="cube" opacity="0.2"/>
    </g>
    
    <g transform="translate(60, 40)">
      <polygon points="0,-25 30,-40 60,-25 30,-10" class="cube-fill" opacity="0.6"/>
      <polygon points="0,-25 30,-40 60,-25 30,-10" class="cube" opacity="0.7"/>
      <polygon points="0,-25 30,-10 30,30 0,15" class="cube" opacity="0.3"/>
      <polygon points="30,-10 60,-25 60,15 30,30" class="cube" opacity="0.15"/>
    </g>
    
    <line x1="-30" y1="5" x2="0" y2="0" class="wire-dim"/>
    <line x1="40" y1="0" x2="60" y2="20" class="wire-dim"/>
    <line x1="-30" y1="5" x2="60" y2="20" class="wire-dim" stroke-dasharray="4 4"/>
    
    <circle cx="-70" cy="-45" r="2.5" class="node"/>
    <circle cx="90" cy="-35" r="2" class="node-dim"/>
    <circle cx="-50" cy="65" r="2" class="node-dim"/>
    <circle cx="80" cy="55" r="2.5" class="node"/>
    
    <line x1="-90" y1="65" x2="110" y2="65" class="wire-dim"/>
    <line x1="-90" y1="65" x2="-90" y2="-55" class="wire-dim"/>
    <line x1="110" y1="65" x2="110" y2="-55" class="wire-dim"/>
  </g>

  <line x1="540" y1="230" x2="420" y2="250" class="wire-dim"/>
  <line x1="540" y1="230" x2="620" y2="300" class="wire-dim"/>
  <line x1="540" y1="230" x2="380" y2="180" class="wire-dim"/>
  <line x1="540" y1="230" x2="480" y2="350" class="wire-dim"/>

  <circle cx="180" cy="140" r="2" class="node-dim"/>
  <circle cx="320" cy="340" r="2.5" class="node"/>
  <circle cx="720" cy="400" r="2" class="node-dim"/>
  <circle cx="680" cy="110" r="2.5" class="node"/>
  <circle cx="140" cy="420" r="2" class="node-dim"/>
  <circle cx="280" cy="180" r="2.5" class="node"/>
  <circle cx="650" cy="380" r="2" class="node-dim"/>

  <path d="M 25 65 L 25 25 L 65 25" class="wire" fill="none"/>
  <path d="M 775 65 L 775 25 L 735 25" class="wire" fill="none"/>
  <path d="M 25 435 L 25 475 L 65 475" class="wire" fill="none"/>
  <path d="M 775 435 L 775 475 L 735 475" class="wire" fill="none"/>

  <text x="35" y="110" class="label">ARCHIVE</text>
  <text x="35" y="122" class="label">ACTIVE</text>
  <text x="730" y="110" class="label">BLOCKSCAN</text>
  <text x="730" y="122" class="label">2026</text>
  <text x="35" y="465" class="label">VHS</text>
  <text x="710" y="465" class="label">DATA INDEX</text>

  <text x="35" y="445" class="stamp">BLK.003</text>
  <text x="680" y="445" class="stamp">TYPE: ANALYTICS</text>

  <line x1="80" y1="485" x2="720" y2="485" stroke="rgba(255,107,53,0.05)" stroke-width="0.5"/>

  <rect width="800" height="500" fill="url(#vignette-analytics)" pointer-events="none"/>
</svg>