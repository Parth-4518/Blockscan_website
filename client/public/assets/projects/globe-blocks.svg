<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background -->
  <rect width="800" height="500" fill="#0A0A0A"/>

  <!-- Subtle grid -->
  <g opacity="0.06">
    <line x1="0" y1="100" x2="800" y2="100" stroke="#DFFF00" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#DFFF00" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#DFFF00" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#DFFF00" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="#DFFF00" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke="#DFFF00" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="#DFFF00" stroke-width="0.5"/>
  </g>

  <!-- Outer frame -->
  <rect x="120" y="80" width="560" height="340" fill="none" stroke="#DFFF00" stroke-width="0.5" opacity="0.15"/>

  <!-- Corner brackets -->
  <path d="M 280 130 L 280 110 L 300 110" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.7"/>
  <path d="M 500 110 L 520 110 L 520 130" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.7"/>
  <path d="M 280 370 L 280 390 L 300 390" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.7"/>
  <path d="M 500 390 L 520 390 L 520 370" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.7"/>

  <!-- Globe wireframe -->
  <circle cx="400" cy="250" r="100" fill="none" stroke="#DFFF00" stroke-width="1.5" opacity="0.9"/>
  <circle cx="400" cy="250" r="96" fill="none" stroke="#DFFF00" stroke-width="0.6" opacity="0.3"/>

  <!-- Globe grid lines -->
  <!-- Vertical meridians -->
  <ellipse cx="400" cy="250" rx="30" ry="100" fill="none" stroke="#DFFF00" stroke-width="0.7" opacity="0.4"/>
  <ellipse cx="400" cy="250" rx="60" ry="100" fill="none" stroke="#DFFF00" stroke-width="0.7" opacity="0.4"/>
  <ellipse cx="400" cy="250" rx="85" ry="100" fill="none" stroke="#DFFF00" stroke-width="0.7" opacity="0.3"/>

  <!-- Horizontal parallels -->
  <line x1="300" y1="200" x2="500" y2="200" stroke="#DFFF00" stroke-width="0.7" opacity="0.4"/>
  <line x1="300" y1="250" x2="500" y2="250" stroke="#DFFF00" stroke-width="0.7" opacity="0.5"/>
  <line x1="300" y1="300" x2="500" y2="300" stroke="#DFFF00" stroke-width="0.7" opacity="0.4"/>

  <!-- Equator highlight -->
  <line x1="310" y1="250" x2="490" y2="250" stroke="#DFFF00" stroke-width="1" opacity="0.7"/>

  <!-- Continents (simplified wireframe shapes) -->
  <!-- North America-ish -->
  <path d="M 360 170 L 380 165 L 390 180 L 385 200 L 370 210 L 355 195 Z" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.5"/>
  <!-- Europe/Africa-ish -->
  <path d="M 420 175 L 435 170 L 440 200 L 430 230 L 415 225 L 410 195 Z" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.5"/>
  <!-- Asia-ish -->
  <path d="M 450 180 L 470 175 L 480 200 L 465 220 L 445 210 L 440 190 Z" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.5"/>

  <!-- Orbiting blockchain cubes -->
  <!-- Cube 1 (top-left orbit) -->
  <g transform="translate(320, 140)">
    <rect x="0" y="0" width="24" height="24" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.9"/>
    <line x1="12" y1="0" x2="12" y2="24" stroke="#DFFF00" stroke-width="0.6" opacity="0.4"/>
    <line x1="0" y1="12" x2="24" y2="12" stroke="#DFFF00" stroke-width="0.6" opacity="0.4"/>
    <circle cx="12" cy="12" r="2.5" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.7"/>
  </g>

  <!-- Cube 2 (top-right orbit) -->
  <g transform="translate(460, 150)">
    <rect x="0" y="0" width="24" height="24" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.9"/>
    <line x1="12" y1="0" x2="12" y2="24" stroke="#DFFF00" stroke-width="0.6" opacity="0.4"/>
    <line x1="0" y1="12" x2="24" y2="12" stroke="#DFFF00" stroke-width="0.6" opacity="0.4"/>
    <circle cx="12" cy="12" r="2.5" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.7"/>
  </g>

  <!-- Cube 3 (bottom-left orbit) -->
  <g transform="translate(290, 320)">
    <rect x="0" y="0" width="24" height="24" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.9"/>
    <line x1="12" y1="0" x2="12" y2="24" stroke="#DFFF00" stroke-width="0.6" opacity="0.4"/>
    <line x1="0" y1="12" x2="24" y2="12" stroke="#DFFF00" stroke-width="0.6" opacity="0.4"/>
    <circle cx="12" cy="12" r="2.5" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.7"/>
  </g>

  <!-- Cube 4 (bottom-right orbit) -->
  <g transform="translate(480, 310)">
    <rect x="0" y="0" width="24" height="24" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.9"/>
    <line x1="12" y1="0" x2="12" y2="24" stroke="#DFFF00" stroke-width="0.6" opacity="0.4"/>
    <line x1="0" y1="12" x2="24" y2="12" stroke="#DFFF00" stroke-width="0.6" opacity="0.4"/>
    <circle cx="12" cy="12" r="2.5" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.7"/>
  </g>

  <!-- Cube 5 (left orbit) -->
  <g transform="translate(250, 230)">
    <rect x="0" y="0" width="24" height="24" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.9"/>
    <line x1="12" y1="0" x2="12" y2="24" stroke="#DFFF00" stroke-width="0.6" opacity="0.4"/>
    <line x1="0" y1="12" x2="24" y2="12" stroke="#DFFF00" stroke-width="0.6" opacity="0.4"/>
    <circle cx="12" cy="12" r="2.5" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.7"/>
  </g>

  <!-- Cube 6 (right orbit) -->
  <g transform="translate(510, 240)">
    <rect x="0" y="0" width="24" height="24" fill="none" stroke="#DFFF00" stroke-width="1.2" opacity="0.9"/>
    <line x1="12" y1="0" x2="12" y2="24" stroke="#DFFF00" stroke-width="0.6" opacity="0.4"/>
    <line x1="0" y1="12" x2="24" y2="12" stroke="#DFFF00" stroke-width="0.6" opacity="0.4"/>
    <circle cx="12" cy="12" r="2.5" fill="none" stroke="#DFFF00" stroke-width="0.8" opacity="0.7"/>
  </g>

  <!-- Orbit lines connecting cubes to globe -->
  <line x1="332" y1="152" x2="360" y2="200" stroke="#DFFF00" stroke-width="0.6" opacity="0.3"/>
  <line x1="472" y1="162" x2="440" y2="200" stroke="#DFFF00" stroke-width="0.6" opacity="0.3"/>
  <line x1="302" y1="332" x2="350" y2="300" stroke="#DFFF00" stroke-width="0.6" opacity="0.3"/>
  <line x1="492" y1="322" x2="450" y2="300" stroke="#DFFF00" stroke-width="0.6" opacity="0.3"/>
  <line x1="262" y1="242" x2="320" y2="250" stroke="#DFFF00" stroke-width="0.6" opacity="0.3"/>
  <line x1="522" y1="252" x2="480" y2="250" stroke="#DFFF00" stroke-width="0.6" opacity="0.3"/>

  <!-- Outer orbit ring -->
  <ellipse cx="400" cy="250" rx="180" ry="70" fill="none" stroke="#DFFF00" stroke-width="0.5" opacity="0.2" transform="rotate(-15 400 250)"/>

  <!-- Data nodes -->
  <circle cx="280" cy="170" r="3" fill="none" stroke="#DFFF00" stroke-width="1" opacity="0.6"/>
  <circle cx="520" cy="180" r="3" fill="none" stroke="#DFFF00" stroke-width="1" opacity="0.6"/>
  <circle cx="270" cy="340" r="3" fill="none" stroke="#DFFF00" stroke-width="1" opacity="0.6"/>
  <circle cx="530" cy="330" r="3" fill="none" stroke="#DFFF00" stroke-width="1" opacity="0.6"/>

  <!-- Scan lines -->
  <line x1="150" y1="180" x2="240" y2="180" stroke="#DFFF00" stroke-width="0.5" opacity="0.2" stroke-dasharray="6 3"/>
  <line x1="150" y1="320" x2="240" y2="320" stroke="#DFFF00" stroke-width="0.5" opacity="0.2" stroke-dasharray="6 3"/>
  <line x1="560" y1="160" x2="650" y2="160" stroke="#DFFF00" stroke-width="0.5" opacity="0.2" stroke-dasharray="6 3"/>
  <line x1="560" y1="340" x2="650" y2="340" stroke="#DFFF00" stroke-width="0.5" opacity="0.2" stroke-dasharray="6 3"/>

  <!-- Small decorative dots -->
  <circle cx="200" cy="150" r="2" fill="#DFFF00" opacity="0.3"/>
  <circle cx="600" cy="350" r="2" fill="#DFFF00" opacity="0.3"/>
  <circle cx="220" cy="360" r="1.5" fill="#DFFF00" opacity="0.2"/>
  <circle cx="580" cy="160" r="1.5" fill="#DFFF00" opacity="0.2"/>

  <!-- Horizontal scan line -->
  <line x1="0" y1="250" x2="800" y2="250" stroke="#DFFF00" stroke-width="0.3" opacity="0.08"/>
</svg>