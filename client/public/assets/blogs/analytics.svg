<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      .bg { fill: #0a0a0a; }
      .grid { stroke: rgba(223, 255, 0, 0.04); stroke-width: 0.5; }
      .wire { fill: none; stroke: #DFFF00; stroke-width: 0.6; opacity: 0.2; }
      .node { fill: #DFFF00; }
      .text { font-family: 'IBM Plex Sans', monospace; font-size: 8px; fill: rgba(223, 255, 0, 0.1); letter-spacing: 0.2em; }
    </style>
    <pattern id="g" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" class="grid"/>
    </pattern>
    <radialGradient id="spot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DFFF00" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#DFFF00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" class="bg"/>
  <rect width="800" height="500" fill="url(#g)"/>
  <rect width="800" height="500" fill="url(#spot)"/>

  <!-- Corner brackets -->
  <path d="M 30 30 L 30 60 L 60 60" class="wire" fill="none" opacity="0.3"/>
  <path d="M 770 30 L 770 60 L 740 60" class="wire" fill="none" opacity="0.3"/>
  <path d="M 30 470 L 30 440 L 60 440" class="wire" fill="none" opacity="0.3"/>
  <path d="M 770 470 L 770 440 L 740 440" class="wire" fill="none" opacity="0.3"/>

  <!-- ============================================
       HERO: Dashboard + charts + connected cubes
       ============================================ -->
  <g transform="translate(400, 260) scale(11)">
    <!-- Dashboard frame -->
    <rect x="-12" y="-10" width="24" height="18" class="wire" stroke-width="0.4" rx="0.5"/>
    
    <!-- Top bar -->
    <line x1="-12" y1="-6" x2="12" y2="-6" class="wire" stroke-width="0.3" opacity="0.4"/>
    
    <!-- Chart 1: bar chart -->
    <rect x="-10" y="-2" width="2" height="6" class="wire" stroke-width="0.3" opacity="0.5"/>
    <rect x="-6" y="0" width="2" height="4" class="wire" stroke-width="0.3" opacity="0.5"/>
    <rect x="-2" y="-1" width="2" height="5" class="wire" stroke-width="0.3" opacity="0.5"/>
    <rect x="2" y="1" width="2" height="3" class="wire" stroke-width="0.3" opacity="0.5"/>
    <rect x="6" y="-2" width="2" height="6" class="wire" stroke-width="0.3" opacity="0.5"/>
    
    <!-- Chart 2: line graph -->
    <polyline points="-10,6 -6,4 -2,5 2,3 6,4 10,2" class="wire" stroke-width="0.3" opacity="0.4" fill="none"/>
    
    <!-- Data points -->
    <circle cx="-10" cy="6" r="0.3" class="node" opacity="0.5"/>
    <circle cx="-6" cy="4" r="0.3" class="node" opacity="0.5"/>
    <circle cx="-2" cy="5" r="0.3" class="node" opacity="0.5"/>
    <circle cx="2" cy="3" r="0.3" class="node" opacity="0.5"/>
    <circle cx="6" cy="4" r="0.3" class="node" opacity="0.5"/>
    <circle cx="10" cy="2" r="0.3" class="node" opacity="0.5"/>
    
    <!-- Connected cubes (bottom right) -->
    <rect x="8" y="-4" width="3" height="3" class="wire" stroke-width="0.3" opacity="0.4"/>
    <rect x="8" y="1" width="3" height="3" class="wire" stroke-width="0.3" opacity="0.4"/>
    <line x1="9.5" y1="-1" x2="9.5" y2="1" class="wire" stroke-width="0.2" opacity="0.3"/>
  </g>

  <text x="40" y="40" class="text">BLOCKCHAIN ANALYTICS</text>
  <text x="40" y="52" class="text">REAL-TIME DATA</text>
  <text x="600" y="465" class="text">OPENSCAN AI</text>
</svg>