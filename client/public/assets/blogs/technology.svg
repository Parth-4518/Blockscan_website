<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      .bg { fill: #0a0a0a; }
      .grid { stroke: rgba(223, 255, 0, 0.04); stroke-width: 0.5; }
      .wire { fill: none; stroke: #DFFF00; stroke-width: 0.6; opacity: 0.2; }
      .node { fill: #DFFF00; }
      .text { font-family: 'IBM Plex Sans', monospace; font-size: 8px; fill: rgba(223, 255, 0, 0.12); letter-spacing: 0.2em; }
    </style>
    <pattern id="g" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" class="grid"/>
    </pattern>
    <radialGradient id="spot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DFFF00" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#DFFF00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" class="bg"/>
  <rect width="800" height="500" fill="url(#g)"/>
  <rect width="800" height="500" fill="url(#spot)"/>

  <!-- Blockchain data visualization -->
  <g transform="translate(400, 250) scale(8)">
    <!-- Connected blocks -->
    <rect x="-18" y="-6" width="10" height="10" class="wire" rx="1"/>
    <rect x="-5" y="-6" width="10" height="10" class="wire" rx="1"/>
    <rect x="8" y="-6" width="10" height="10" class="wire" rx="1"/>
    <line x1="-8" y1="-1" x2="-5" y2="-1" class="wire" stroke-width="0.4"/>
    <line x1="5" y1="-1" x2="8" y2="-1" class="wire" stroke-width="0.4"/>
    <!-- Hash lines -->
    <line x1="-13" y1="-10" x2="-13" y2="-14" class="wire" stroke-width="0.3" opacity="0.5"/>
    <line x1="0" y1="-10" x2="0" y2="-14" class="wire" stroke-width="0.3" opacity="0.5"/>
    <line x1="13" y1="-10" x2="13" y2="-14" class="wire" stroke-width="0.3" opacity="0.5"/>
    <!-- Nodes -->
    <circle cx="-13" cy="-1" r="0.5" class="node" opacity="0.6"/>
    <circle cx="0" cy="-1" r="0.5" class="node" opacity="0.6"/>
    <circle cx="13" cy="-1" r="0.5" class="node" opacity="0.6"/>
  </g>

  <!-- Corner brackets -->
  <path d="M 30 30 L 30 60 L 60 60" class="wire" fill="none" opacity="0.3"/>
  <path d="M 770 30 L 770 60 L 740 60" class="wire" fill="none" opacity="0.3"/>
  <path d="M 30 470 L 30 440 L 60 440" class="wire" fill="none" opacity="0.3"/>
  <path d="M 770 470 L 770 440 L 740 440" class="wire" fill="none" opacity="0.3"/>

  <text x="40" y="40" class="text">BLOCKCHAIN DATA</text>
  <text x="40" y="52" class="text">CHAIN ID: 50</text>
  <text x="600" y="465" class="text">XDC NETWORK</text>
</svg>