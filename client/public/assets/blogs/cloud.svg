<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      .bg { fill: #0a0a0a; }
      .grid { stroke: rgba(223, 255, 0, 0.04); stroke-width: 0.5; }
      .wire { fill: none; stroke: #DFFF00; stroke-width: 0.6; opacity: 0.2; }
      .node { fill: #DFFF00; }
      .text { font-family: 'IBM Plex Sans', monospace; font-size: 8px; fill: rgba(223, 255, 0, 0.1); letter-spacing: 0.2em; }
    </style>
    <pattern id="g" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" class="grid"/>
    </pattern>
    <radialGradient id="spot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DFFF00" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#DFFF00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" class="bg"/>
  <rect width="800" height="500" fill="url(#g)"/>
  <rect width="800" height="500" fill="url(#spot)"/>

  <!-- Corner brackets -->
  <path d="M 30 30 L 30 60 L 60 60" class="wire" fill="none" opacity="0.3"/>
  <path d="M 770 30 L 770 60 L 740 60" class="wire" fill="none" opacity="0.3"/>
  <path d="M 30 470 L 30 440 L 60 440" class="wire" fill="none" opacity="0.3"/>
  <path d="M 770 470 L 770 440 L 740 440" class="wire" fill="none" opacity="0.3"/>

  <!-- ============================================
       HERO: Cloud + servers + data streams
       ============================================ -->
  <g transform="translate(400, 260) scale(11)">
    <!-- Cloud outline -->
    <path d="M-8 -2 Q -8 -6 -4 -6 Q -2 -8 2 -8 Q 6 -8 8 -4 Q 10 -4 10 0 Q 10 4 6 4 L -6 4 Q -10 4 -10 0 Q -10 -2 -8 -2" class="wire" stroke-width="0.5" fill="none"/>

    <!-- Server lines below cloud -->
    <line x1="-4" y1="4" x2="-4" y2="8" class="wire" stroke-width="0.3" opacity="0.4"/>
    <line x1="0" y1="4" x2="0" y2="8" class="wire" stroke-width="0.3" opacity="0.4"/>
    <line x1="4" y1="4" x2="4" y2="8" class="wire" stroke-width="0.3" opacity="0.4"/>

    <!-- Server nodes -->
    <rect x="-5" y="8" width="2" height="2" class="wire" stroke-width="0.3" opacity="0.4"/>
    <rect x="-1" y="8" width="2" height="2" class="wire" stroke-width="0.3" opacity="0.4"/>
    <rect x="3" y="8" width="2" height="2" class="wire" stroke-width="0.3" opacity="0.4"/>

    <!-- Data streams -->
    <line x1="-4" y1="6" x2="-4" y2="7" class="wire" stroke-width="0.2" opacity="0.6"/>
    <line x1="0" y1="6" x2="0" y2="7.5" class="wire" stroke-width="0.2" opacity="0.6"/>
    <line x1="4" y1="6" x2="4" y2="7" class="wire" stroke-width="0.2" opacity="0.6"/>

    <!-- Status dots -->
    <circle cx="-4" cy="9" r="0.3" class="node" opacity="0.5"/>
    <circle cx="0" cy="9" r="0.3" class="node" opacity="0.7"/>
    <circle cx="4" cy="9" r="0.3" class="node" opacity="0.5"/>

    <!-- Cloud detail -->
    <path d="M-5 -4 Q -2 -6 2 -6" class="wire" stroke-width="0.3" opacity="0.3" fill="none"/>
  </g>

  <text x="40" y="40" class="text">CLOUD INFRASTRUCTURE</text>
  <text x="40" y="52" class="text">REGION: GLOBAL</text>
  <text x="600" y="465" class="text">GOCLOUDX</text>
</svg>